<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Preview</title>

    <!-- load library -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer.min.js"
    ></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        height: 100%;
        overflow: hidden;
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
        background-color: transparent !important;
        --poster-color: transparent !important;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="modelViewer"
      src="pv.glb"
      camera-controls
      auto-rotate
      disable-zoom
      shadow-intensity="1"
      environment-image="none"
      exposure="1.2"
      style="background-color: transparent;"
    ></model-viewer>

    <script>
      const viewer = document.getElementById("modelViewer");
      viewer.environmentImage = null;
      viewer.style.background = "transparent";
    </script>
  </body>
</html>
