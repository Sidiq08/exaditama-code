<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Preview</title>

    <!-- Load model-viewer library -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer.min.js"
    ></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        height: 100%;
        overflow: hidden;
      }

      model-viewer {
        width: 100vw;
        height: 100vh;
        background-color: transparent !important;
        --poster-color: transparent !important;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="modelViewer"
      src="pv.glb"
      camera-controls
      autoplay
      animation-loop
      auto-rotate
      disable-zoom
      shadow-intensity="1"
      environment-image="none"
      exposure="1.2"
      style="background-color: transparent;"
    ></model-viewer>

    <script>
      const viewer = document.getElementById("modelViewer");

      // pastikan background transparan
      viewer.environmentImage = null;
      viewer.style.background = "transparent";

      // kalau model tidak punya animasi internal, kita kasih animasi rotasi manual
      let angle = 0;
      function rotateFallback() {
        // deteksi kalau tidak ada animasi bawaan
        if (!viewer.availableAnimations || viewer.availableAnimations.length === 0) {
          angle += 0.2;
          viewer.orientation = `${angle}deg 0deg 0deg`;
        }
        requestAnimationFrame(rotateFallback);
      }
      rotateFallback();
    </script>
  </body>
</html>
