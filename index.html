<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>3D Preview</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
body {
  margin: 0;
  background: transparent; /* penting */
}
model-viewer {
  width: 100vw;
  height: 100vh;
  background-color: transparent !important; /* pastikan override */
}
    </style>
  </head>
  <body>
   <model-viewer
  src="pv.glb"
  camera-controls
  auto-rotate
  disable-zoom
  shadow-intensity="1"
  environment-image="neutral"
  style="background-color: transparent;"
  id="modelViewer"
></model-viewer>
  </body>
  <script>
  const viewer = document.getElementById('modelViewer')
  viewer.style.background = 'transparent'
  viewer.setAttribute('reveal', 'interaction')
</script>
</html>
